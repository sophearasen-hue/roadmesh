# RoadMesh CI — runs on every push and pull request (BUILD_PLAN Step 1).
# Third-party actions are pinned to full commit SHAs (AUDIT S-24); Dependabot keeps them current.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  FLUTTER_VERSION: "3.47.9"
  CARGO_AUDIT_VERSION: "0.23.0"
  GITLEAKS_VERSION: "v8.30.1"
  FUZZ_TOOLCHAIN: "nightly-2026-11-01" # cargo-fuzz needs nightly; used only for fuzz/
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  cargo-audit:
    name: Rust dependencies (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}"
      - run: cargo audit --deny warnings

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Analyze the Android plugin's Dart API
        working-directory: android
        run: |
          flutter pub get
          flutter analyze --fatal-infos

  android:
    name: Android (Rust core for 3 ABIs, debug APK, Kotlin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"
      - name: Cross-compile the core and generate the Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android-core.sh
      - name: Debug APK
        working-directory: app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: app/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew :roadmesh_android:testDebugUnitTest

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      # Built from source: the Go checksum database verifies the module (no unverified binary download).
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: "$(go env GOPATH)/bin/gitleaks git --redact --verbose --exit-code 1 ."

  fuzz:
    name: Fuzz smoke test (5 min per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - run: cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"
      - name: Build targets
        working-directory: fuzz
        run: cargo +"${FUZZ_TOOLCHAIN}" fuzz build -O
      - name: Run each target (AUDIT S-10; the 24 h release run is in docs/RELEASE.md)
        working-directory: fuzz
        run: |
          for t in rsm_frame receive_pipeline pki_parsers; do
            cargo +"${FUZZ_TOOLCHAIN}" fuzz run -O "$t" -- -max_total_time=300
          done

  reference:
    name: Reference engine (read-only guard, golden file, 26 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: scripts/check-reference.sh
      - name: Golden outcomes match the reference
        run: python scripts/golden_from_reference.py --check
      - name: Run reference tests
        working-directory: reference/core-python
        run: python -m unittest discover -s tests -t . -v
