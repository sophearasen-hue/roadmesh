# RoadMesh CI — runs on every push and pull request (BUILD_PLAN Step 1).
# Third-party actions are pinned to full commit SHAs (AUDIT S-24); Dependabot keeps them current.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  FLUTTER_VERSION: "3.47.9"
  CARGO_AUDIT_VERSION: "0.23.0"
  GITLEAKS_VERSION: "v8.30.1"
  FUZZ_TOOLCHAIN: "nightly-2026-11-01" # cargo-fuzz needs nightly; used only for fuzz/
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, server with AWS KMS (production build)
        run: cargo clippy -p roadmesh-server --features aws-kms --locked -- -D warnings
      - run: cargo test --workspace --locked

  cargo-audit:
    name: Rust dependencies (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}"
      - run: cargo audit --deny warnings

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Analyze the platform plugins
        run: |
          (cd android && flutter pub get && flutter analyze --fatal-infos)
          (cd ios && flutter pub get && flutter analyze --fatal-infos)

  android:
    name: Android (Rust core for 3 ABIs, debug APK, Kotlin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"
      - name: Cross-compile the core and generate the Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android-core.sh
      - name: Debug APK
        working-directory: app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: app/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew :roadmesh_android:testDebugUnitTest

  ios:
    name: iOS (Rust core XCFramework, Swift tests, simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build the core as an XCFramework and generate the Swift bindings
        run: scripts/build-ios-core.sh
      - name: Swift unit tests (RoadMeshKit)
        working-directory: ios/RoadMeshKit
        run: swift test
      - name: Simulator build of the app (Swift Package Manager)
        working-directory: app
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug
      - name: App bundle carries the privacy manifest and the English/Khmer permission texts (AUDIT L-02, L-03)
        working-directory: app
        run: |
          app=build/ios/iphonesimulator/Runner.app
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/en.lproj/InfoPlist.strings"
          test -f "$app/km.lproj/InfoPlist.strings"
          plutil -extract CPTemplateApplicationSceneSessionRoleApplication raw -o - "$app/Info.plist" >/dev/null 2>&1 \
            || plutil -p "$app/Info.plist" | grep -q CPTemplateApplicationScene

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      # Built from source: the Go checksum database verifies the module (no unverified binary download).
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: "$(go env GOPATH)/bin/gitleaks git --redact --verbose --exit-code 1 ."

  fuzz:
    name: Fuzz smoke test (5 min per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - run: cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"
      - name: Build targets
        working-directory: fuzz
        run: cargo +"${FUZZ_TOOLCHAIN}" fuzz build -O
      - name: Run each target (AUDIT S-10; the 24 h release run is in docs/RELEASE.md)
        working-directory: fuzz
        run: |
          for t in rsm_frame receive_pipeline pki_parsers fragments mqtt server_inputs; do
            cargo +"${FUZZ_TOOLCHAIN}" fuzz run -O "$t" -- -max_total_time=300
          done

  mobsf:
    name: Static analysis (MobSF rules, AUDIT S-25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install mobsfscan==1.2.0 semgrep
      - name: No high or warning findings
        run: |
          mobsfscan --json -o mobsf.json android/android/src/main ios/ios/roadmesh_ios/Sources app/lib \
            app/android/app/src/main app/ios/Runner || true
          python3 - <<'PY'
          import json, sys
          d = json.load(open("mobsf.json"))
          bad = {k: v["metadata"]["severity"] for k, v in d.get("results", {}).items()
                 if v["metadata"]["severity"] in ("ERROR", "WARNING")}
          print(json.dumps(bad, indent=1) if bad else "no high or warning findings")
          sys.exit(1 if bad or d.get("errors") else 0)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobsf-report
          path: mobsf.json

  sbom:
    name: SBOM (CycloneDX, AUDIT S-24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - run: cargo cyclonedx --format json --all-features
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-rust
          path: "**/*.cdx.json"

  reference:
    name: Reference engine (read-only guard, golden file, 26 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: scripts/check-reference.sh
      - name: Golden outcomes match the reference
        run: python scripts/golden_from_reference.py --check
      - name: Run reference tests
        working-directory: reference/core-python
        run: python -m unittest discover -s tests -t . -v
