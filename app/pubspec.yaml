name: roadmesh_app
description: RoadMesh phone app (Flutter UI). Safety logic lives in ../core (Rust).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.3
  roadmesh_android:
    path: ../android
  roadmesh_ios:
    path: ../ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Khmer and Latin in one family, bundled (never loaded from the network). OFL licence
  # in assets/fonts/OFL-KantumruyPro.txt. Static instances of the variable font.
  fonts:
    - family: Kantumruy Pro
      fonts:
        - asset: assets/fonts/KantumruyPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/KantumruyPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/KantumruyPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700
