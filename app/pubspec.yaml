name: roadmesh_app
description: RoadMesh phone app (Flutter UI). Safety logic lives in ../core (Rust).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  roadmesh_android:
    path: ../android
  roadmesh_ios:
    path: ../ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
