[package]
name = "roadmesh-core"
description = "RoadMesh safety core: RSM codec, LDM, tracker, prediction, alerts, scoring, security checks. Pure logic, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "roadmesh_core"

[dependencies]
# Pure-Rust ECDSA P-256 verification (SPEC §10). No private keys live in the core.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
# Tests generate throwaway keys from the OS random source at run time.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "getrandom"] }

[lints]
workspace = true
