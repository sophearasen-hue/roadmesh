[package]
name = "roadmesh-server"
description = "Edge relay, certificate authority and hazard service (BUILD_PLAN Step 9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "roadmesh_server"

[features]
# AWS KMS signing for the CA keys (production). Off by default so tests and local
# builds need no AWS SDK; CI builds it.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]

[dependencies]
roadmesh-core = { path = "../core" }
# TLS 1.3 only: rustls without the "tls12" feature cannot speak TLS 1.2 at all.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
# Device certificates (X.509 for mutual TLS), signed through the CA key interface.
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
x509-parser = "0.18"
time = "0.3"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
sha2 = "0.11"
# App Attest (CBOR) and Play Integrity (JSON) evidence.
ciborium = "0.2"
serde_json = "1"
base64 = "0.22"
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }

[dev-dependencies]
# Tests make throwaway TLS server certificates and speak TLS 1.2 to prove it is refused.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Tests generate throwaway CA and device keys from the OS random source at run time.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "getrandom", "pkcs8", "alloc"] }

[lints]
workspace = true
