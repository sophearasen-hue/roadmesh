[package]
name = "roadmesh-server"
description = "Edge relay, certificate authority and hazard service (BUILD_PLAN Step 9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "roadmesh_server"

[dependencies]
roadmesh-core = { path = "../core" }

[dev-dependencies]
# Tests generate throwaway CA and device keys from the OS random source at run time.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "getrandom"] }

[lints]
workspace = true
