name: roadmesh_ios
description: "RoadMesh iOS radio: CoreBluetooth transport, Secure Enclave keys and the Rust safety core (BUILD_PLAN Step 6)."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: RoadmeshIosPlugin
