[package]
name = "roadmesh-sim"
description = "Traffic simulator that drives roadmesh-core with GPS noise and packet loss (BUILD_PLAN Step 4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# precomputed-tables: ~2x faster verification for the many simulated phones (needs std)
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "precomputed-tables", "std"] }
roadmesh-core = { path = "../core" }
roadmesh-server = { path = "../server" }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
