name: roadmesh_android
description: "RoadMesh Android radio: Bluetooth LE transport, foreground service, Keystore keys and the Rust safety core (BUILD_PLAN Step 5)."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.roadmesh.android
        pluginClass: RoadmeshAndroidPlugin
