[workspace]
resolver = "3"
members = ["core", "sim", "server"]
# cargo-fuzz targets build with a pinned nightly (see fuzz/README.md)
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Crypto in debug builds and tests would otherwise be ~50x slower; the simulator
# verifies every message with real ECDSA. Optimises dependencies only.
[profile.dev.package."*"]
opt-level = 3
